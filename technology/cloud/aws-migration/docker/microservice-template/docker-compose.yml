version: '3.8'

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - SERVICE_NAME=user-service
      - DATABASE_URL=postgresql://user:pass@db:5432/microservices_db
    depends_on:
      - db
    networks:
      - app-network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ENVIRONMENT=development
      - SERVICE_NAME=order-service
      - DATABASE_URL=postgresql://user:pass@db:5432/microservices_db
      - USER_SERVICE_URL=http://user-service:8080
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=microservices_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
